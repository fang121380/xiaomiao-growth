<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- 背景渐变：奶油金到深金 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF1D6"/>
      <stop offset="60%" stop-color="#F5DDB0"/>
      <stop offset="100%" stop-color="#E8C383"/>
    </linearGradient>
    <!-- 毛发渐变：金渐层 -->
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E0B0"/>
      <stop offset="50%" stop-color="#E8C383"/>
      <stop offset="100%" stop-color="#C9A058"/>
    </linearGradient>
    <!-- 耳朵内侧渐变：粉色 -->
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD3D3"/>
      <stop offset="100%" stop-color="#F5A6A6"/>
    </linearGradient>
    <!-- 眼睛渐变：碧绿 -->
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A8D070"/>
      <stop offset="60%" stop-color="#5FA82C"/>
      <stop offset="100%" stop-color="#3D7B1F"/>
    </radialGradient>
    <!-- 鼻头渐变 -->
    <radialGradient id="nose" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFB0B0"/>
      <stop offset="100%" stop-color="#E66E6E"/>
    </radialGradient>
    <!-- 阴影 -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- 圆角矩形背景 -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- 装饰小星星 -->
  <g opacity="0.5" fill="#FFF8E0">
    <circle cx="160" cy="180" r="6"/>
    <circle cx="880" cy="160" r="8"/>
    <circle cx="200" cy="860" r="5"/>
    <circle cx="860" cy="880" r="7"/>
    <path d="M 130 460 l 0 16 m -8 -8 l 16 0" stroke="#FFF8E0" stroke-width="2" stroke-linecap="round"/>
    <path d="M 900 480 l 0 12 m -6 -6 l 12 0" stroke="#FFF8E0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 软阴影底 -->
  <ellipse cx="512" cy="880" rx="280" ry="40" fill="#000" opacity="0.12" filter="url(#soft)"/>

  <!-- 身体（小尾巴+身体轮廓） -->
  <g>
    <!-- 尾巴 -->
    <path d="M 760 720 Q 870 650 850 540 Q 830 460 770 490"
          fill="url(#fur)" stroke="#A8843C" stroke-width="3" stroke-linejoin="round"/>
    <!-- 身体 -->
    <ellipse cx="512" cy="780" rx="240" ry="120" fill="url(#fur)" stroke="#A8843C" stroke-width="3"/>
    <!-- 身体毛尖纹理 -->
    <g opacity="0.5" stroke="#A8843C" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M 320 740 q 8 -16 16 0"/>
      <path d="M 380 720 q 8 -14 16 0"/>
      <path d="M 440 700 q 8 -14 16 0"/>
      <path d="M 500 690 q 8 -14 16 0"/>
      <path d="M 560 700 q 8 -14 16 0"/>
      <path d="M 620 720 q 8 -14 16 0"/>
      <path d="M 680 740 q 8 -14 16 0"/>
    </g>
  </g>

  <!-- 头 -->
  <g>
    <!-- 左耳 -->
    <path d="M 280 340 L 320 200 L 420 320 Z" fill="url(#fur)" stroke="#A8843C" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 320 280 L 340 240 L 390 310 Z" fill="url(#ear)"/>
    <!-- 右耳 -->
    <path d="M 744 340 L 704 200 L 604 320 Z" fill="url(#fur)" stroke="#A8843C" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 704 280 L 684 240 L 634 310 Z" fill="url(#ear)"/>

    <!-- 脸（圆形） -->
    <ellipse cx="512" cy="500" rx="260" ry="240" fill="url(#fur)" stroke="#A8843C" stroke-width="4"/>

    <!-- 额头M字形金渐层标记 -->
    <path d="M 380 380 Q 430 320 460 380" fill="none" stroke="#A8843C" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <path d="M 564 380 Q 594 320 644 380" fill="none" stroke="#A8843C" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

    <!-- 眼睛（左） -->
    <ellipse cx="420" cy="500" rx="44" ry="58" fill="url(#eye)" stroke="#3D7B1F" stroke-width="3"/>
    <ellipse cx="420" cy="500" rx="22" ry="40" fill="#2A5810"/>
    <ellipse cx="430" cy="488" rx="8" ry="14" fill="#FFF"/>
    <circle cx="412" cy="510" r="3" fill="#FFF" opacity="0.7"/>

    <!-- 眼睛（右） -->
    <ellipse cx="604" cy="500" rx="44" ry="58" fill="url(#eye)" stroke="#3D7B1F" stroke-width="3"/>
    <ellipse cx="604" cy="500" rx="22" ry="40" fill="#2A5810"/>
    <ellipse cx="614" cy="488" rx="8" ry="14" fill="#FFF"/>
    <circle cx="596" cy="510" r="3" fill="#FFF" opacity="0.7"/>

    <!-- 鼻头 -->
    <path d="M 480 580 Q 512 560 544 580 Q 530 612 512 614 Q 494 612 480 580 Z" fill="url(#nose)" stroke="#C25454" stroke-width="2"/>

    <!-- 嘴 -->
    <path d="M 512 614 L 512 632" stroke="#7A4818" stroke-width="3" stroke-linecap="round"/>
    <path d="M 512 632 Q 488 654 470 638" stroke="#7A4818" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 512 632 Q 536 654 554 638" stroke="#7A4818" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- 腮红 -->
    <ellipse cx="340" cy="580" rx="32" ry="20" fill="#FFB8B8" opacity="0.6"/>
    <ellipse cx="684" cy="580" rx="32" ry="20" fill="#FFB8B8" opacity="0.6"/>

    <!-- 胡须 -->
    <g stroke="#7A4818" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M 280 560 Q 340 575 400 575"/>
      <path d="M 280 590 Q 340 595 400 590"/>
      <path d="M 280 620 Q 340 620 400 610"/>
      <path d="M 744 560 Q 684 575 624 575"/>
      <path d="M 744 590 Q 684 595 624 590"/>
      <path d="M 744 620 Q 684 620 624 610"/>
    </g>
  </g>
</svg>